<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Example Shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Decision Shortlist template (generic). Edit only the DATA block in the script.
   VOICE: calm buying guide. IDEA: a shop-shelf card per option; matches step forward.
   COLOUR: tokens below with light-dark(); swap --accent/--water per category if you like.
   TYPE: Schibsted Grotesk + Inter. LAYOUT: header, lineup, filters, cards, head-to-head, picks, metrics, mentions, footer. */
:root{color-scheme:light dark;
  --bg:light-dark(#eef5f8,#0d1a20);--surface:light-dark(#ffffff,#132630);--stage:light-dark(#e1eef3,#1a323d);
  --ink:light-dark(#0f2530,#e4f0f4);--muted:light-dark(#506570,#93abb5);--line:light-dark(#d3e2e8,#24414d);
  --accent:light-dark(#0a6d8f,#5cc2e0);--accent-soft:light-dark(#dcf0f7,#163d4b);
  --warn:light-dark(#b0442a,#f0937a);--warn-soft:light-dark(#fbe9e3,#3b2219);
  --water:light-dark(#8fd3ec,#3f9fbf);--body:light-dark(#f7fafb,#d9e4e8);
  --font-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;--font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);overflow-x:clip;padding:32px max(16px,4vw) 56px}
.wrap{max-width:1140px;margin:0 auto;display:grid;gap:28px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
h3{font-size:20px;font-weight:600}
.kicker{font-size:14px;font-weight:600;color:var(--accent)}
header{display:grid;gap:10px}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.theme button{font:600 13px var(--font-body);color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 14px;min-height:36px;cursor:pointer}
.theme button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
header p{margin:0;max-width:70ch;color:var(--muted)}
.lede{color:var(--ink)!important;font-size:17px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.art svg{display:block;width:100%;height:100%}
.art.photo{background:#fff!important;padding:6px}.art img{display:block;width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.thumbs button{width:56px;height:56px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.thumbs button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.cap{font-size:13px;color:var(--muted);text-align:center}

/* lineup */
.lineup{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.lineup a{flex:1 1 112px;max-width:240px;transition:flex-grow .35s ease,opacity .25s,border-color .25s;display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.lineup .art{aspect-ratio:1;background:var(--stage);border-radius:10px}
.lineup span{font-size:14px;font-weight:600;line-height:1.3}
.lineup small{font-size:13px;color:var(--muted);white-space:nowrap}

/* filters */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:14px}
.filters-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.summary{font-size:15px;color:var(--muted)}.summary b{color:var(--ink)}
.reset{font:600 14px var(--font-body);color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer}
.reset:hover{border-color:var(--accent)}.reset:disabled{opacity:.5;cursor:default;border-color:transparent}
.sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 26px}
.slider{display:grid;gap:4px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-size:14px;font-weight:600}
.slider output{font-size:14px;font-weight:600;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.slider input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0;min-height:28px}
.slider .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;align-self:center;min-height:44px}
.toggle input{accent-color:var(--accent);width:20px;height:20px}
.note{font-size:14px;color:var(--muted);margin:0}

/* option cards */
.opts{display:grid;gap:18px}
.opt{display:grid;grid-template-columns:260px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-margin-top:16px;transition:box-shadow .25s,border-color .25s}
.side{background:var(--stage);padding:16px;display:grid;gap:10px;align-content:start}
.side .art{aspect-ratio:1;border-radius:12px;background:var(--surface)}
.side .type{font-size:13px;color:var(--muted);text-align:center}
.shop-links{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center}
.shop-links a{font-size:14px;font-weight:600;text-decoration:none}.shop-links a:hover{text-decoration:underline}
.info{padding:20px 22px;display:grid;gap:14px;align-content:start}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.price strong{font-family:var(--font-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.price .where{font-size:14px;color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.specs b{color:var(--ink);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.cols h4,.pc h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
ul{margin:0;padding-left:18px;display:grid;gap:3px}li{font-size:15px}
.verdict-line{margin:0;font-size:15px;padding-top:12px;border-top:1px dashed var(--line)}
.pc{border-top:1px dashed var(--line);padding-top:10px}
.pc summary{cursor:pointer;font-size:15px;font-weight:600;color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px;min-height:32px}
.pc summary::-webkit-details-marker{display:none}
.pc summary::before{content:"+";width:20px;height:20px;display:inline-grid;place-items:center;border:1px solid var(--accent);border-radius:50%;font-size:13px}
.pc[open] summary::before{content:"\2212"}
.pc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-top:12px}
.pc ul{list-style:none;padding-left:0}.pc li{padding-left:18px;position:relative}
.pc .pros li::before{content:"+";position:absolute;left:2px;color:var(--accent);font-weight:700}
.pc .cons li::before{content:"\2212";position:absolute;left:2px;color:var(--warn);font-weight:700}
.pc-src{margin:10px 0 0;font-size:13px;color:var(--muted)}

/* verdict */
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pick{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:4px;align-content:start}
.pick .kicker{font-size:13px}.pick.skip .kicker{color:var(--warn)}
.pick p{margin:0;font-size:15px;color:var(--muted)}

/* tables */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-family:var(--font-display);font-size:14px;font-weight:600;background:var(--stage);vertical-align:bottom}
thead .art{width:56px;height:56px;margin-bottom:6px;border-radius:8px;background:var(--surface)}
tbody th{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
td{font-variant-numeric:tabular-nums}
tr.group th{background:var(--bg);color:var(--accent);padding-top:14px}
tr:last-child td,tr:last-child th{border-bottom:none}
.best{color:var(--accent);font-weight:600}.no{color:var(--muted)}.bad{color:var(--warn)}
.hm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0;padding:0;list-style:none}
.hm li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.hm .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hm b{font-family:var(--font-display);font-size:16px}.hm .kr{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.hm span.why{font-size:14px;color:var(--muted)}
@media (max-width:700px){.hm{grid-template-columns:minmax(0,1fr)}}
footer{font-size:14px;color:var(--muted);display:grid;gap:6px}footer p{margin:0;max-width:85ch}

/* relevance: grow, keep, or shrink */
.lineup a.is-match{flex-grow:2.2;max-width:300px;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lineup a.is-soft{flex-grow:1.2}
.lineup a.is-hard{flex-grow:.4;flex-basis:96px;opacity:.7}
.lineup a.is-hard .art{filter:grayscale(.8)}
.lineup a.is-hard small{display:none}
.opt.is-match{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.is-hard:not(.expanded){grid-template-columns:110px minmax(0,1fr)}
.opt.is-hard:not(.expanded) .side{padding:10px;gap:0}
.opt.is-hard:not(.expanded) .art{filter:grayscale(.8)}
.opt.is-hard:not(.expanded) :is(.thumbs,.cap,.type,.shop-links,.cols,.verdict-line,.pc,.badge,.specs){display:none}
.opt.is-hard:not(.expanded) .info{padding:12px 16px;gap:6px;align-content:center}
.opt.is-hard:not(.expanded) h3{font-size:17px;color:var(--muted)}
.opt.is-hard:not(.expanded) .price strong{font-size:18px}
.opt.is-hard:not(.expanded) .price .where{display:none}
.more{display:none;font:600 13px var(--font-body);color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.more:hover{border-color:var(--accent)}.opt.is-hard .more{display:inline-block}
td.dim-hard,th.dim-hard{opacity:.32}td.dim-soft,th.dim-soft{opacity:.7}
th.col-match{box-shadow:inset 0 -3px 0 var(--accent)}
td,th{transition:opacity .25s}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.soft{background:var(--stage);color:var(--muted)}.chip.hard{background:var(--warn-soft);color:var(--warn)}
.chip[hidden]{display:none}
.lineup .chip{justify-self:start;font-size:12px;padding:2px 7px}
@media (prefers-reduced-motion:reduce){.lineup a,.opt,td,th{transition:none}}
@media (max-width:860px){.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{grid-template-columns:minmax(0,1fr)}.side .art{max-width:220px;margin:0 auto;width:100%}.cols,.pc-grid{grid-template-columns:minmax(0,1fr)}.verdict{grid-template-columns:repeat(2,minmax(0,1fr))}.info{padding:18px 16px}}
@media (max-width:520px){.lineup a{flex-basis:100px}.lineup span{font-size:13px}.sliders,.verdict{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <span class="kicker" id="kicker"></span>
      <div class="theme" role="group" aria-label="Colour theme">
        <button type="button" data-theme-set="auto" aria-pressed="true">Auto</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
    <h1 id="title"></h1>
    <p class="lede" id="brief"></p>
    <p id="basis"></p>
  </header>

  <nav class="lineup" id="lineup" aria-label="Jump to an option"></nav>

  <section class="filters" aria-labelledby="filters-h">
    <div class="filters-head">
      <h2 id="filters-h">Narrow it down</h2>
      <span class="summary" id="summary" aria-live="polite"></span>
      <button type="button" class="reset" id="reset" disabled>Reset filters</button>
    </div>
    <div class="sliders" id="sliders"></div>
    <p class="note" id="filter-note"></p>
  </section>

  <section class="opts" id="opts" aria-label="Options"></section>

  <section id="h2h" style="display:grid;gap:12px" hidden></section>

  <section aria-labelledby="verdict-h" style="display:grid;gap:12px">
    <h2 id="verdict-h">Which one</h2>
    <div class="verdict" id="picks"></div>
  </section>

  <section aria-labelledby="metrics-h" style="display:grid;gap:12px">
    <h2 id="metrics-h">Main metrics</h2>
    <div class="table-wrap"><table id="metrics"></table></div>
    <p class="note" id="metrics-note"></p>
  </section>

  <section id="mentions" aria-labelledby="hm-h" style="display:grid;gap:12px" hidden>
    <h2 id="hm-h">Honourable mentions</h2>
    <p class="note" id="hm-intro" style="font-size:16px;color:var(--ink);max-width:72ch"></p>
    <ul class="hm" id="hm"></ul>
  </section>

  <footer id="footer"></footer>
</div>

<script>
{
/* ============================================================
   DATA: the only part to edit for a new shortlist.
   Text fields are escaped. Inside them, **bold** and [label](https://url) are supported.
   Option order here is the order everywhere: tiles, cards, table columns.
   Slider kinds:
     cat   - 3-stop categorical with "Any" in the middle; option value must equal keys[i]
     level - needs ladder; each level after the first names a grade key (0 miss, 1 partial, 2 full)
     min   - "at least"; optional soft tolerance (a near miss shows a grey chip instead of shrinking)
     score - "at least", ignored while at default; options with null drop out as "No expert score"
     max   - "up to" (budget, weight); put these last
   ============================================================ */
const DATA = {
  topic: "example",
  title: "Example Shortlist",
  kicker: "Example category · 3 finalists · prices checked 1 January 2027",
  brief: "Sample data: replace the DATA block with your own research. One line on who it's for and what matters.",
  basis: "Prices are the lowest local price before shipping. Scores are from one named independent tester; options it hasn't reviewed say so.",
  person: "them",
  noun: "options",
  sliders: [
    { id: "type", kind: "cat", label: "Type", stops: ["Countertop", "Any", "Handheld"], keys: ["top", null, "hand"], miss: ["Not countertop", null, "Not handheld"] },
    { id: "needs", kind: "level", label: "Needs", levels: [
      { label: "Basic" },
      { label: "Sensitive", key: "gentle", partial: "Fewer gentle settings", miss: "Too harsh" },
      { label: "Advanced", key: "special", partial: "Partial special support", miss: "No special parts listed" } ] },
    { id: "cap", kind: "min", label: "Capacity, at least", min: 100, max: 600, step: 50, unit: " ml", soft: 50, softMsg: "{d} smaller", miss: "Too small", ends: ["Any", "600 ml"] },
    { id: "ease", kind: "min", label: "Easy to use, at least", min: 1, max: 5, step: 1, names: ["", "Any", "Fair", "OK", "Easy", "Very easy"], miss: "Harder to use", ends: ["Any", "Very easy"] },
    { id: "score", kind: "score", label: "Expert score, at least", min: 2, max: 5, step: 1, unit: " stars", miss: "Lower score", none: "No expert score", ends: ["Any", "5 stars"] },
    { id: "price", kind: "max", label: "Budget, up to", min: 200, max: 900, step: 25, unit: " kr", miss: "Over budget", ends: ["200 kr", "900 kr"] }
  ],
  note: "Matching options grow and get an outline. One that breaks a limit shrinks to a compact row. A near miss keeps its size with a grey label. Filters stick: they are saved in the page address and remembered in this browser. “Easy to use” is my rating from reviews.",
  options: [
    { id: "alpha", name: "Example Alpha 600", short: "Alpha 600", price: 799, where: "Shop A, in stock · 829 kr at Shop B", kindLabel: "Countertop, plugs in",
      art: { shape: "top", body: "#f4f6f7", trim: "#1f6fa8" }, photos: [],
      links: [{ t: "Compare prices →", u: "https://example.com" }],
      badges: [{ t: "Best for the brief" }],
      specs: ["capacity **600 ml**", "**10** settings", "expert **5/5**", "buyers **4.6/5** (1,200)"],
      why: ["Gentlest lowest setting", "Big capacity, no refills"], good: ["Needs a socket nearby", "Takes counter space"],
      verdict: "The all-round pick when space allows.",
      pros: ["Wide range of settings", "Special parts included"], cons: ["Bulky", "Pricier"],
      sources: [{ t: "Example tester review", u: "https://example.com" }],
      v: { type: "top", gentle: 2, special: 2, cap: 600, ease: 5, score: 5, price: 799 } },
    { id: "beta", name: "Example Beta Go", short: "Beta Go", price: 499, where: "Shop C, 1–2 days", kindLabel: "Handheld, rechargeable",
      art: { shape: "wand", body: "#26365c", trim: "#9fb6d9" }, photos: [],
      links: [{ t: "Compare prices →", u: "https://example.com" }],
      badges: [{ t: "Best value" }],
      specs: ["capacity **250 ml**", "**3** settings", "expert **5/5**"],
      why: ["Cordless", "Comfortable grip"], good: ["Refill mid-use likely"],
      verdict: "Top-rated handheld at a good price.",
      pros: ["Portable", "Easy grip"], cons: ["Small tank"],
      sources: [{ t: "Example tester review", u: "https://example.com" }],
      v: { type: "hand", gentle: 1, special: 2, cap: 250, ease: 5, score: 5, price: 499 } },
    { id: "gamma", name: "Example Gamma Mini", short: "Gamma Mini", price: 249, where: "Marketplace, one listing", kindLabel: "Handheld, rechargeable",
      art: { shape: "box", body: "#c9b3dc", trim: "#7a5a9c" }, photos: [],
      links: [{ t: "Marketplace →", u: "https://example.com" }],
      badges: [{ t: "Least proven", warn: true }],
      specs: ["capacity **200 ml**", "**4** modes", "buyers **4.3/5** (20,000)"],
      why: ["Cheapest"], good: ["No expert review found", "Specs marked (est.) are estimates"],
      verdict: "A low-risk trial; thin evidence.",
      pros: ["Price"], cons: ["No independent tests"],
      sources: [{ t: "Marketplace listing", u: "https://example.com" }],
      v: { type: "hand", gentle: 1, special: 0, cap: 200, ease: 3, score: null, price: 249 } }
  ],
  h2h: { title: "The two closest rivals", intro: "Where they differ.", a: "alpha", b: "beta",
    rows: [["Price", "799 kr", "499 kr", "b"], ["Capacity", "600 ml", "250 ml", "a"]] },
  picks: [
    { kicker: "Best for the brief", name: "Example Alpha 600", text: "Why, in one or two sentences." },
    { kicker: "Best value", name: "Example Beta Go", text: "Why, and a fallback if the deal ends." },
    { kicker: "Skip", name: "Something weak", text: "Why not.", skip: true }
  ],
  table: [
    { group: "Size", rows: [
      { label: "Type", cells: ["Countertop", "Handheld", "Handheld"] },
      { label: "Capacity", cells: [["600 ml", "best"], "250 ml", ["200 ml", "bad"]] } ] },
    { group: "Reviews & buying", rows: [
      { label: "Expert score", cells: [["5/5", "best"], ["5/5", "best"], ["Not reviewed", "no"]] },
      { label: "Best price", cells: ["799 kr", "499 kr", ["249 kr", "best"]] } ] }
  ],
  tableNote: "Highlighted cells are best in their row, warning-coloured ones the weakest. “Not listed” means the maker doesn't say.",
  mentions: { intro: "Looked at but left off the shortlist. Prices checked 1 January 2027.", items: [
    { name: "Example Delta", price: "999 kr", why: "Pricier sibling with nothing the brief needs." },
    { name: "Example Epsilon", price: "199 kr", why: "No independent test found." } ] },
  footer: ["Prices checked on 1 January 2027 at [Example price site](https://example.com), before shipping.", "Sources: the tester and shop pages linked on each card."]
};

/* ============================================================
   Engine: no need to edit below for a new shortlist.
   ============================================================ */
const $ = function (id) { return document.getElementById(id); };
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function md(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function list(items, cls) { return '<ul' + (cls ? ' class="' + cls + '"' : "") + ">" + (items || []).map(function (i) { return "<li>" + md(i) + "</li>"; }).join("") + "</ul>"; }
function links(arr) { return (arr || []).map(function (l) { return '<a href="' + esc(l.u) + '" target="_blank" rel="noopener">' + esc(l.t) + "</a>"; }).join(""); }
const OPTS = DATA.options, BYID = {};
OPTS.forEach(function (o) { BYID[o.id] = o; });
function kr(n) { return n.toLocaleString("da-DK") + " kr"; }

/* fallback drawings when an option has no photos */
function draw(a) {
  a = a || { shape: "box", body: "#e6edf0", trim: "#0a6d8f" };
  const sh = '<ellipse cx="100" cy="183" rx="60" ry="7" fill="rgba(0,0,0,.14)"/>';
  if (a.shape === "top") return '<svg viewBox="0 0 200 200" aria-hidden="true">' + sh +
    '<rect x="44" y="34" width="92" height="66" rx="16" fill="var(--water)" opacity=".75"/>' +
    '<rect x="38" y="92" width="104" height="88" rx="18" fill="' + a.body + '" stroke="rgba(0,0,0,.12)"/>' +
    '<circle cx="90" cy="132" r="13" fill="' + a.trim + '"/>' +
    '<path d="M140 160 C 170 160 168 120 160 104" fill="none" stroke="#c8d2d6" stroke-width="4"/>' +
    '<rect x="152" y="54" width="16" height="56" rx="8" fill="' + a.body + '" stroke="rgba(0,0,0,.14)"/>' +
    '<path d="M160 54 L 160 30 L 152 22" fill="none" stroke="' + a.trim + '" stroke-width="4" stroke-linecap="round"/></svg>';
  if (a.shape === "wand") return '<svg viewBox="0 0 200 200" aria-hidden="true">' + sh +
    '<rect x="74" y="46" width="52" height="138" rx="24" fill="' + a.body + '" stroke="rgba(0,0,0,.12)"/>' +
    '<rect x="74" y="122" width="52" height="62" rx="20" fill="var(--water)" opacity=".7"/>' +
    '<circle cx="100" cy="84" r="9" fill="' + a.trim + '"/>' +
    '<path d="M100 46 L 100 22 L 90 12" fill="none" stroke="' + a.trim + '" stroke-width="5" stroke-linecap="round"/></svg>';
  return '<svg viewBox="0 0 200 200" aria-hidden="true">' + sh +
    '<rect x="46" y="40" width="108" height="140" rx="22" fill="' + a.body + '" stroke="rgba(0,0,0,.12)"/>' +
    '<rect x="62" y="58" width="76" height="40" rx="10" fill="#fff" opacity=".45"/>' +
    '<circle cx="100" cy="140" r="16" fill="' + a.trim + '"/></svg>';
}
function photo(o, i) { const p = o.photos[i]; return '<img src="' + esc(p[0]) + '" alt="' + esc(o.name + ", " + p[1]) + '" loading="lazy">'; }
function art(o) { return o.photos && o.photos.length ? '<div class="art photo">' + photo(o, 0) + "</div>" : '<div class="art">' + draw(o.art) + "</div>"; }

/* ---------- render ---------- */
document.title = DATA.title;
$("kicker").textContent = DATA.kicker; $("title").textContent = DATA.title;
$("brief").textContent = DATA.brief; $("basis").textContent = DATA.basis;
$("filter-note").textContent = DATA.note; $("metrics-note").textContent = DATA.tableNote || "";

$("lineup").innerHTML = OPTS.map(function (o) {
  return '<a href="#' + esc(o.id) + '" data-opt="' + esc(o.id) + '">' + art(o) + "<span>" + esc(o.short || o.name) + "</span><small>" + kr(o.price) + '</small><span class="chip" hidden></span></a>';
}).join("");

$("sliders").innerHTML = DATA.sliders.map(function (s) {
  const min = s.kind === "cat" || s.kind === "level" ? 0 : s.min;
  const max = s.kind === "cat" ? 2 : s.kind === "level" ? s.levels.length - 1 : s.max;
  const ends = s.kind === "cat" ? [s.stops[0], s.stops[2]] : s.kind === "level" ? [s.levels[0].label, s.levels[s.levels.length - 1].label] : s.ends;
  return '<div class="slider"><div class="slider-top"><label for="f-' + s.id + '">' + esc(s.label) + '</label><output id="o-' + s.id + '" for="f-' + s.id + '"></output></div>' +
    '<input type="range" id="f-' + s.id + '" min="' + min + '" max="' + max + '" step="' + (s.step || 1) + '">' +
    '<div class="ends"><span>' + esc(ends[0]) + "</span><span>" + esc(ends[1]) + "</span></div></div>";
}).join("");

$("opts").innerHTML = OPTS.map(function (o) {
  const thumbs = o.photos && o.photos.length > 1 ? o.photos.map(function (p, i) {
    return '<button type="button" aria-label="Show ' + esc(p[1]) + '" aria-pressed="' + (i === 0) + '" data-i="' + i + '"><img src="' + esc(p[0]) + '" alt=""></button>';
  }).join("") : "";
  return '<article class="opt" id="' + esc(o.id) + '" data-opt="' + esc(o.id) + '"><div class="side">' + art(o) +
    '<div class="cap">' + esc(o.photos && o.photos[0] ? o.photos[0][1] : "") + '</div><div class="thumbs">' + thumbs + "</div>" +
    '<div class="type">' + esc(o.kindLabel || "") + '</div><div class="shop-links">' + links(o.links) + "</div></div>" +
    '<div class="info"><div class="title-row"><h3>' + esc(o.name) + '</h3><div class="badges"><span class="chip" hidden></span>' +
    (o.badges || []).map(function (b) { return '<span class="badge' + (b.warn ? " warn" : "") + '">' + esc(b.t) + "</span>"; }).join("") +
    '<button type="button" class="more" aria-expanded="false">Show details</button></div></div>' +
    '<div class="price"><strong>' + kr(o.price) + '</strong><span class="where">' + md(o.where) + "</span></div>" +
    '<div class="specs">' + (o.specs || []).map(function (s) { return "<span>" + md(s) + "</span>"; }).join("") + "</div>" +
    '<div class="cols"><div><h4>Why it suits ' + esc(DATA.person) + "</h4>" + list(o.why) + "</div><div><h4>Good to know</h4>" + list(o.good) + "</div></div>" +
    '<p class="verdict-line">' + md(o.verdict) + "</p>" +
    '<details class="pc"><summary>Pros &amp; cons from reviews</summary><div class="pc-grid"><div><h4>Pros</h4>' + list(o.pros, "pros") + "</div><div><h4>Cons</h4>" + list(o.cons, "cons") + "</div></div>" +
    '<p class="pc-src">Sources: ' + links(o.sources).replace(/<\/a><a/g, "</a> · <a") + "</p></details></div></article>";
}).join("");

if (DATA.h2h) {
  const h = DATA.h2h, A = BYID[h.a], B = BYID[h.b], sec = $("h2h");
  sec.hidden = false;
  sec.innerHTML = "<h2>" + esc(h.title) + '</h2><p class="note" style="font-size:16px;color:var(--ink);max-width:72ch">' + md(h.intro) + "</p>" +
    '<div class="table-wrap"><table style="min-width:520px"><thead><tr><td></td><th scope="col">' + art(A) + esc(A.short || A.name) + '</th><th scope="col">' + art(B) + esc(B.short || B.name) + "</th></tr></thead><tbody>" +
    h.rows.map(function (r) { return '<tr><th scope="row">' + esc(r[0]) + "</th><td" + (r[3] === "a" ? ' class="best"' : "") + ">" + md(r[1]) + "</td><td" + (r[3] === "b" ? ' class="best"' : "") + ">" + md(r[2]) + "</td></tr>"; }).join("") +
    "</tbody></table></div>";
}

$("picks").innerHTML = (DATA.picks || []).map(function (p) {
  return '<div class="pick' + (p.skip ? " skip" : "") + '"><span class="kicker">' + esc(p.kicker) + "</span><h3>" + esc(p.name) + "</h3><p>" + md(p.text) + "</p></div>";
}).join("");

$("metrics").style.minWidth = Math.max(560, 160 + OPTS.length * 130) + "px";
$("metrics").innerHTML = "<thead><tr><td></td>" + OPTS.map(function (o) { return '<th scope="col" data-opt="' + esc(o.id) + '">' + art(o) + esc(o.short || o.name) + "</th>"; }).join("") + "</tr></thead><tbody>" +
  DATA.table.map(function (g) {
    return '<tr class="group"><th scope="row" colspan="' + (OPTS.length + 1) + '">' + esc(g.group) + "</th></tr>" +
      g.rows.map(function (r) {
        return '<tr><th scope="row">' + esc(r.label) + "</th>" + OPTS.map(function (o, i) {
          const c = r.cells[i], t = Array.isArray(c) ? c[0] : c, cls = Array.isArray(c) ? c[1] : "";
          return '<td data-opt="' + esc(o.id) + '"' + (cls ? ' class="' + esc(cls) + '"' : "") + ">" + md(t == null ? "" : t) + "</td>";
        }).join("") + "</tr>";
      }).join("");
  }).join("") + "</tbody>";

if (DATA.mentions && DATA.mentions.items.length) {
  $("mentions").hidden = false;
  $("hm-intro").innerHTML = md(DATA.mentions.intro);
  $("hm").innerHTML = DATA.mentions.items.map(function (m) {
    return '<li><div class="row"><b>' + esc(m.name) + '</b><span class="kr">' + esc(m.price) + '</span></div><span class="why">' + md(m.why) + "</span></li>";
  }).join("");
}
$("footer").innerHTML = (DATA.footer || []).map(function (p) { return "<p>" + md(p) + "</p>"; }).join("");

/* thumbnails and "Show details" */
document.querySelectorAll(".opt").forEach(function (card) {
  const o = BYID[card.dataset.opt], main = card.querySelector(".side .art"), cap = card.querySelector(".cap"), box = card.querySelector(".thumbs");
  box.addEventListener("click", function (e) {
    const b = e.target.closest("button"); if (!b) return;
    const i = +b.dataset.i; main.innerHTML = photo(o, i); cap.textContent = o.photos[i][1];
    box.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  });
  const more = card.querySelector(".more");
  more.addEventListener("click", function () {
    const open = card.classList.toggle("expanded");
    more.textContent = open ? "Hide details" : "Show details";
    more.setAttribute("aria-expanded", open ? "true" : "false");
  });
});

/* ---------- filters ---------- */
const SL = DATA.sliders, inputs = {}, DEFAULTS = {};
SL.forEach(function (s) {
  inputs[s.id] = $("f-" + s.id);
  DEFAULTS[s.id] = s.kind === "cat" ? 1 : s.kind === "level" ? 0 : s.kind === "max" ? s.max : s.min;
  inputs[s.id].value = DEFAULTS[s.id];
});
function read() { const f = {}; SL.forEach(function (s) { f[s.id] = +inputs[s.id].value; }); return f; }
function isDefault(f) { return SL.every(function (s) { return f[s.id] === DEFAULTS[s.id]; }); }
function fmt(s, v) {
  if (s.kind === "cat") return s.stops[v];
  if (s.kind === "level") return s.levels[v].label;
  if (s.kind === "max") return v + (s.unit || "");
  if (v === DEFAULTS[s.id]) return "Any";
  return s.names ? s.names[v] : v + (s.unit || "") + "+";
}
function judge(o, f) {
  const hard = [], soft = [], v = o.v;
  SL.forEach(function (s) {
    const x = f[s.id], val = v[s.id];
    if (s.kind === "cat") { if (s.keys[x] && val !== s.keys[x]) hard.push(s.miss[x]); }
    else if (s.kind === "level") {
      for (let i = 1; i <= x; i++) {
        const L = s.levels[i], g = v[L.key] || 0;
        if (g === 0) hard.push(L.miss); else if (g === 1) soft.push(L.partial);
      }
    }
    else if (s.kind === "max") { if (val > x) hard.push(s.miss); }
    else if (s.kind === "score") { if (x !== DEFAULTS[s.id]) { if (val == null) hard.push(s.none); else if (val < x) hard.push(s.miss); } }
    else if (val < x) {
      const d = x - val;
      if (s.soft && d <= s.soft) soft.push(s.softMsg.replace("{d}", d + (s.unit || "")));
      else hard.push(s.miss);
    }
  });
  return { hard: hard, soft: soft };
}
function apply() {
  const f = read(), active = !isDefault(f);
  SL.forEach(function (s) { $("o-" + s.id).textContent = fmt(s, f[s.id]); });
  let full = 0;
  OPTS.forEach(function (o) {
    const r = judge(o, f), level = r.hard.length ? "hard" : r.soft.length ? "soft" : "";
    if (!level) full++;
    document.querySelectorAll('[data-opt="' + o.id + '"]').forEach(function (el) {
      if (el.tagName === "TD" || el.tagName === "TH") {
        el.classList.toggle("dim-hard", level === "hard"); el.classList.toggle("dim-soft", level === "soft");
        if (el.tagName === "TH") el.classList.toggle("col-match", active && !level);
        return;
      }
      el.classList.toggle("is-match", active && !level); el.classList.toggle("is-soft", level === "soft"); el.classList.toggle("is-hard", level === "hard");
      if (level !== "hard" && el.classList.contains("expanded")) { el.classList.remove("expanded"); const mb = el.querySelector(".more"); mb.textContent = "Show details"; mb.setAttribute("aria-expanded", "false"); }
      const chip = el.querySelector(".chip"), tile = el.tagName === "A";
      chip.hidden = !active; chip.className = "chip" + (level ? " " + level : "");
      chip.textContent = level === "hard" ? (tile ? r.hard[0] : r.hard.join(" · ")) : level === "soft" ? (tile ? r.soft[0] : r.soft.join(" · ")) : "Matches";
    });
  });
  $("summary").innerHTML = "<b>" + full + " of " + OPTS.length + "</b> " + esc(DATA.noun || "options") + " match";
  $("reset").disabled = !active;
}

/* sticky filters: plain hash #f-v1-v2-... in slider order, plus localStorage */
const STORE = DATA.topic + "-shortlist-filters", THEME = DATA.topic + "-shortlist-theme";
function encode(f) { return "f-" + SL.map(function (s) { return f[s.id]; }).join("-"); }
function decode(str) {
  const m = /^f-(\d+(?:-\d+)*)$/.exec(str || ""); if (!m) return null;
  const v = m[1].split("-").map(Number); if (v.length !== SL.length) return null;
  const f = {}; SL.forEach(function (s, i) { const el = inputs[s.id]; f[s.id] = Math.min(+el.max, Math.max(+el.min, v[i])); });
  return f;
}
function load(f) { SL.forEach(function (s) { inputs[s.id].value = f[s.id]; }); }
function persist() {
  const f = read(), base = location.href.split("#")[0];
  try { history.replaceState(null, "", isDefault(f) ? base : "#" + encode(f)); } catch (e) {}
  try { if (isDefault(f)) localStorage.removeItem(STORE); else localStorage.setItem(STORE, encode(f)); } catch (e) {}
}
function update() { apply(); persist(); }
function reset() { load(DEFAULTS); update(); }
SL.forEach(function (s) { inputs[s.id].addEventListener("input", update); inputs[s.id].addEventListener("change", update); });
$("reset").addEventListener("click", reset);
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !isDefault(read())) reset(); });
window.addEventListener("hashchange", function () { const f = decode(location.hash.slice(1)); if (f) { load(f); apply(); persist(); } });
let start = decode(location.hash.slice(1));
if (!start) { try { start = decode(localStorage.getItem(STORE)); } catch (e) {} }
if (start) load(start);
apply();
if (start) persist();

/* theme: Auto follows the viewer or system; Light/Dark override and are remembered */
const root = document.documentElement, viewerTheme = root.getAttribute("data-theme");
function setTheme(t) {
  if (t === "auto") { if (viewerTheme) root.setAttribute("data-theme", viewerTheme); else root.removeAttribute("data-theme"); }
  else root.setAttribute("data-theme", t);
  document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.themeSet === t ? "true" : "false"); });
  try { if (t === "auto") localStorage.removeItem(THEME); else localStorage.setItem(THEME, t); } catch (e) {}
}
document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.addEventListener("click", function () { setTheme(b.dataset.themeSet); }); });
let saved = null; try { saved = localStorage.getItem(THEME); } catch (e) {}
if (saved === "light" || saved === "dark") setTheme(saved);
}
</script>
</body>
</html>
