name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JSON manifests
        run: |
          for f in marketplace.json .claude-plugin/marketplace.json \
                   plugin/plugin.json plugin/.claude-plugin/plugin.json \
                   plugin/hooks/hooks.json plugin/com.github.copilot/hooks/hooks.json; do
            [ -f "$f" ] || { echo "missing: $f"; exit 1; }
            python3 -c "import json,sys; json.load(open('$f')); print('OK  '+ '$f')"
          done

      - name: Shell lint (syntax + shellcheck)
        run: |
          scripts="install.sh install-instructions.sh install-plugins.sh scripts/*.sh
                   plugin/hooks/run-hook.sh plugin/hooks/session-start plugin/hooks/session-end"
          for s in $scripts; do bash -n "$s" && echo "OK  $s"; done
          shellcheck -S warning $scripts

      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bats

      - name: Run shell tests
        run: bats tests/*.bats

      - name: Version consistency
        run: ./scripts/sync-version.sh --check

      - name: Skills, generated docs, hook parity, privacy
        run: ./scripts/validate-skills.sh
