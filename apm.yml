name: skills
version: 1.1.0
description: APM project for skills
author: Ahmed Magdy
targets:
- copilot
dependencies:
  apm:
  - anthropics/skills/skills/frontend-design
  - anthropics/skills/skills/mcp-builder
  - anthropics/skills/skills/pdf
  - anthropics/skills/skills/pptx
  - anthropics/skills/skills/skill-creator
  - anthropics/skills/skills/xlsx
  - ayghri/i-have-adhd/skills/i-have-adhd
  - mattpocock/skills/skills/productivity/grill-me
  - humanlayer/skills/plugins/show-me
  - humanlayer/skills/plugins/improve-claude-md
  - github/awesome-copilot/plugins/awesome-copilot
  mcp:
  # awesome-copilot MCP server (public Microsoft sample; no secrets). Pinned by
  # digest so a re-tagged image cannot change what runs; this was `:latest` on
  # 2026-11-13. To update: docker buildx imagetools inspect <image>:latest
  - name: awesome-copilot
    registry: false
    transport: stdio
    command: docker
    args: ["run", "-i", "--rm", "ghcr.io/microsoft/mcp-dotnet-samples/awesome-copilot@sha256:a5d2f9b558c8055d8fd3590fffe7db3fbae56fa985fe3ce36854ade841d8b44e"]
includes: auto
scripts: {}
