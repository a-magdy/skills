name: skills
version: 1.0.0
description: APM project for skills
author: Ahmed Magdy
targets:
- copilot
dependencies:
  apm:
  - anthropics/skills/skills/frontend-design
  - anthropics/skills/skills/mcp-builder
  - anthropics/skills/skills/pdf
  - anthropics/skills/skills/pptx
  - anthropics/skills/skills/skill-creator
  - anthropics/skills/skills/xlsx
  - ayghri/i-have-adhd/skills/i-have-adhd
  - mattpocock/skills/skills/productivity/grill-me
  - humanlayer/skills/plugins/show-me
  - humanlayer/skills/plugins/improve-claude-md
  mcp:
  # Example self-defined stdio MCP server (public Microsoft sample; no secrets).
  - name: awesome-copilot
    registry: false
    transport: stdio
    command: docker
    args: ["run", "-i", "--rm", "ghcr.io/microsoft/mcp-dotnet-samples/awesome-copilot:latest"]
includes: auto
scripts: {}
